spring.application.name=trello-backend

# --- PostgreSQL (docker-compose.yml で起動するコンテナに接続する設定) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/trello
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- JPA / Hibernate ---
# ddl-auto=update: エンティティの定義からテーブルを自動生成・更新する（学習用途のみ。本番運用では使わない）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# data.sql（列の初期データ投入）を、Hibernateのテーブル作成後に実行する
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8080
